<!DOCTYPE html>                            					 <!-- Tells the browser to interpret this document as modern HTML5 -->
<html lang="en">                           					 <!-- Sets the document language to English for accessibility -->
<head>                                    					 <!-- Begins the head section containing unseen page metadata -->
    <meta charset="UTF-8">                  					 <!-- Specifies UTF-8 encoding to support all standard characters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 	 <!-- Scales layout for mobile and desktop screens -->
    <title>My First Webpage</title>         					 <!-- Sets the title text displayed in the browser tab -->
    <link rel="stylesheet" href="style.css"> 					 <!-- Links the external CSS stylesheet to apply visual design -->
</head>                                     					 <!-- Closes the head metadata container -->
<body>                                      					 <!-- Begins the main body container for visible page content -->

    <header>                                					 <!-- Groups top-of-page banner elements like titles and intro -->
        <h1>Welcome to My Page!</h1>        					 <!-- Renders the primary heading title of the webpage -->
        <p>Hi, I'm Spencer and this is my first HTML page.</p> 		 <!-- Displays a brief intro paragraph -->
    
    </header>                               					 <!-- Closes the header banner section -->

    <main>                                  					 <!-- Holds the primary content unique to this webpage -->
        <section>                           					 <!-- Creates a distinct content card for the personal introduction -->
            <h2>About Me</h2>               					 <!-- Renders the heading for the About Me section -->
            <p>I am 24 years old married with a daughter and another child on the way. I I love star wars and airplanes</p> 	 <!-- Placeholder paragraph -->
        </section>                          					 <!-- Closes the About Me section -->

        <section>                           					 <!-- Creates a distinct content card for hobbies -->
            <h2>My Favorite Hobbies</h2>    					 <!-- Renders the heading for the Hobbies section -->
            <ul>                            					 <!-- Begins an unordered bulleted list -->
                <li>Coding & Tech</li>      					 <!-- Displays the first bullet point item -->
                <li>Playing Video Games</li>					 <!-- Displays the second bullet point item -->
                <li>Reading</li>            					 <!-- Displays the third bullet point item -->
            </ul>                          					 <!-- Closes the bulleted list container -->
         <button id="magicBtn">Click for a Secret!</button>
         
        </section>                         					 <!-- Closes the Hobbies section -->

        <section>                          					 <!-- Creates a distinct content card for media display -->
            <h2>Cool Picture</h2>          					 <!-- Renders the heading for the Picture section -->
           
<img src="https://upload.wikimedia.org/wikipedia/en/2/21/Web_of_Spider-Man_Vol_1_129-1.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="A placeholder image"> <!-- Displays an image asset -->
        </section>                         					 <!-- Closes the Picture section -->
    </main>                                					 <!-- Closes the main content area -->

    <footer>                               					 <!-- Defines the footer block at the bottom of the page -->
        <p>Created with HTML & CSS</p>   					 <!-- Displays footer text summarizing tools used -->
    </footer>                              					 <!-- Closes the footer section -->

<script>
// Connect (hook) a click event listener to our button element
const btn = document.getElementById('magicBtn');
btn.addEventListener('click', function() {
alert('✨ Hello! You successfully hooked JavaScript to your HTML page!');
});
</script>

</body>                                    					 <!-- Closes the body element -->
</html>                                    					 <!-- Closes the root HTML document -->
